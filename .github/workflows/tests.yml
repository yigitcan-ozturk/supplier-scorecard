name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Run source tests
        run: python -m unittest discover -s tests -v

      - name: Build and validate distribution
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Install wheel
        run: python -m pip install --force-reinstall dist/*.whl

      - name: Verify installed Python API
        run: python -c "import supplier_scorecard; assert supplier_scorecard.__version__ == '1.0.0'"

      - name: Verify installed CLI
        run: |
          supplier-scorecard --list-profiles
          supplier-scorecard-pipeline --help
